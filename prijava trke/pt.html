<!DOCTYPE html>
<html>

<head>
    <title>Prijava trke</title>
    <link rel="stylesheet" href="pt.css">
</head>

<body>
    <div id="s1">
        <img src="zastava\vecteezy_black-and-white-checkered-flag-background_7718306.jpg" alt="zastava">
    </div>
    <div id="glavni">
        <h1>Prijava trke</h1>
        <div>
            Broj učesnika:
            <input type="number">
        </div>
        <div>
            Imena učesnika:
            <input type="text">
        </div>
        <div>
            Datum:
            <input type="date">
        </div>
        <div>
            Vrijeme:
            <input type="time">
        </div>
        <div>
            Tip vozila:
            <select name="vozila" id="vozila">
                <option value="1">LR5</option>
                <option value="2">RT8</option>
                <option value="3">2Drive</option>
            </select>
        </div>
        <div>
            Tip putanje:
            <select name="putanja" id="putanja">
                <option value="1">Putanja 1</option>
                <option value="2">Putanja 2</option>
                <option value="3">Putanja 3</option>
            </select>
        </div>
        <div>
            <button type="submit"><b>PRIJAVI TRKU</b></button>
        </div>
    </div>
    <div id="s2">
        <img src="zastava\vecteezy_black-and-white-checkered-flag-background_7718306.jpg" alt="zastava">
    </div>
</body>

</html>
